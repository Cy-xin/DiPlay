<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiPlay · 配对码</title>
<style>
:root{color-scheme:light dark;--bg:#edf3f8;--card:#ffffffd9;--ink:#172d43;--muted:#52677b;--blue:#0866ce;--line:#cbdbe8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}main{max-width:560px;margin:8vh auto;padding:24px}header{display:flex;align-items:center;gap:12px;margin-bottom:32px}.mark{width:44px;height:44px;background:var(--blue);border-radius:14px;color:white;display:grid;place-items:center;font-weight:700;font-size:24px}header p{margin:0;color:var(--muted);font-size:14px}h1{font-size:30px;letter-spacing:-.8px;margin:0}section{padding:28px;background:var(--card);border:1px solid var(--line);border-radius:24px}h2{font-size:21px;margin:0 0 8px}p{margin:8px 0 20px;color:var(--muted)}label{display:block;margin-bottom:8px;font-weight:600}select,button,input{font:inherit;min-height:50px;border-radius:12px}select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;margin-bottom:18px}button{width:100%;border:0;background:var(--blue);color:white;padding:12px 18px;font-weight:600;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #709fe3;outline-offset:3px}.result{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}input{width:100%;font-family:ui-monospace,monospace;font-size:28px;font-weight:600;letter-spacing:2px;text-align:center;background:var(--bg);border:1px solid var(--line);color:var(--ink);margin:8px 0 14px;padding:10px}.hint{font-size:14px}footer{font-size:13px;color:var(--muted);padding:18px 4px}#feedback{min-height:24px;margin:4px 0;color:var(--blue)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#182431;--card:#223344;--ink:#e7eff7;--muted:#b4c6d6;--blue:#327de0;--line:#41566a}}@media(max-width:400px){main{padding:16px;margin:4vh auto}section{padding:20px}}
</style>
<main><header><div class="mark" aria-hidden="true">D</div><div><h1>DiPlay 配对码</h1><p>日志上传 · 设备授权</p></div></header>
<section><h2>连接你的车机</h2><p>生成配对码后，在车机的“诊断 → 连接日志服务器”中输入。每台设备只需首次配对。</p>
<form method="post" action="generate"><input type="hidden" name="csrf" value="{{csrf}}"><label for="uses">允许配对的设备数量</label><select id="uses" name="uses"><option value="1">1 台 · 仅车机</option><option value="2" selected>2 台 · 车机与手机</option><option value="3">3 台设备</option><option value="4">4 台设备</option></select><button type="submit">生成配对码</button></form>
<div class="result" {{result_hidden}}><label for="code">新的配对码</label><input id="code" value="{{code}}" readonly spellcheck="false" aria-label="配对码"><button id="copy" type="button">复制配对码</button><p id="feedback" role="status" aria-live="polite"></p><p class="hint">有效期 24 小时，可配对 {{uses}} 台设备。配对码仅在此显示，请及时复制；生成新码不会使已配对的设备失效。</p></div></section>
<footer>仅授权设备上传诊断日志。页面不提供日志下载。请勿向他人分享管理账号或配对码。</footer></main><script src="copy.js" defer></script></html>
