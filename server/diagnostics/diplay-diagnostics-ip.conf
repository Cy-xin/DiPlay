limit_req_zone $binary_remote_addr zone=diplay_admin_login:1m rate=10r/m;
# Proposed isolated TLS listener. Does not change any existing 443 default or named website.
server {
    listen 8443 ssl;
    server_name 140.245.48.181;
    ssl_certificate /etc/diplay-diagnostics/tls/fullchain.pem;
    ssl_certificate_key /etc/diplay-diagnostics/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /diplay-diagnostics/v1/admin/ {
        auth_basic "DiPlay admin";
        auth_basic_user_file /etc/diplay-diagnostics/admin.htpasswd;
        limit_req zone=diplay_admin_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8796;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-DiPlay-Admin $remote_user;
        include /etc/diplay-diagnostics/admin-proxy.conf;
        proxy_set_header Authorization "";
        client_max_body_size 2k;
        proxy_read_timeout 30s;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location = /diplay-diagnostics/v1/admin { return 302 /diplay-diagnostics/v1/admin/; }
    include /etc/nginx/snippets/diplay-diagnostics.conf;
    location / { return 404; }
}
